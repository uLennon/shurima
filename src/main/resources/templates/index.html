<!DOCTYPE html>
<html xmls:th="http://thymeleaf.org/" xmls.layout="http://www.utraq.net.nz/thymeleaf/layourt"
      xmlns:xmls="http://www.w3.org/1999/xhtml">
    <head>
        <title>Shurima</title>
        <link rel="stylesheet" type="text/css" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://db.onlinewebfonts.com/c/12420e8c141ca7c3dff41de2d59df13e?family=Beaufort+for+LOL+Bold"
              rel="stylesheet">
        <link rel="icon" type="image/png" href="https://i.imgur.com/vaBpjKk.png">
        <link rel="stylesheet" href="/css/style.css">
    </head>
    <body class="img-front">
        <h1 class="title">SHURIMA</h1>
        <div class="centralized">
            <form method="post" accept-charset="UTF-8">
                <input class="box box-name" type="text" name="nameTag" required placeholder="Name + #Tag">
                <button class="button button-sub" type="submit">Send</button>
            </form>
        </div>
        <table class="center" th:unless="${error}">
            <th:block th:each="i : ${#numbers.sequence(0, icons.size()-1, 7)}">
                <tr>
                    <td th:each="icon : ${icons.subList(i, i+7 < icons.size() ? i+7 : icons.size())}">
                        <img th:src="${icon}">
                    </td>
                </tr>
            </th:block>
        </table>
        <div class="erro-global" th:if="${error}">
            <h1>Erro - Unable to load info</h1>
        </div>
    </body>
</html>
